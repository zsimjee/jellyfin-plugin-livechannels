changelog:
  features:
  - "New Round robin loop order: one block from each show in turn, alphabetically, starting at each show's first episode and moving every show on to its next block each time round (A 1-2, B 1-2, C 1-2, A 3-4, ...)."
  - "Advance shows every loop option for shuffled channels."
